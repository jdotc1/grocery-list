# Verifies the app still installs, type-checks, lints, and builds on every PR,
# including Dependabot's. automerge.yml only inspects Dependabot's update
# metadata (patch/minor/major) -- it never installs or builds anything, so a
# patch release that breaks the build would otherwise merge unchecked. Add
# this workflow's job as a required status check (alongside merge-gatekeeper)
# so that no longer happens.
name: CI

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run prettier-check

      - name: Lint
        run: npm run lint

      # Runs `tsc -b` (type-check) then `vite build` (production bundle).
      - name: Build
        run: npm run build
